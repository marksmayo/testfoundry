[tool:pytest]
testpaths = tests
addopts = 
    --strict-markers
    --strict-config
    --html=reports/report.html
    --self-contained-html
    -v
markers =
    accessibility: Accessibility tests
    lighthouse: Lighthouse performance tests  
    broken_links: Broken link tests
    seo: SEO tests
    smoke: Smoke tests
    regression: Regression tests
